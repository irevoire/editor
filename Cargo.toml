[package]
name = "editor"
version = "0.1.0"
edition.workspace = true

[dependencies]
action = { workspace = true }
config = { workspace = true }
crossterm = { workspace = true }
env_logger = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
oneshot = { workspace = true }
ropey = { workspace = true }
tokio = { workspace = true }
unicode-segmentation = { workspace = true }

[dev-dependencies]
insta = { workspace = true }

[workspace]
resolver = "3"
members = ["crates/action", "crates/config", "crates/config-macros"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
action = { path = "crates/action" }
config = { path = "crates/config" }
config-macros = { path = "crates/config-macros" }

crossterm = { version = "0.29.0", features = ["event-stream"] }
env_logger = "0.11.11"
include_dir = "0.7.4"
jiff = "0.2.35"
kdl = "6.7.1"
log = "0.4.33"
oneshot = { version = "0.2.1", features = ["std"] }
parking_lot = "0.12"
proc-macro2 = "1.0"
quote = "1.0"
ropey = "1.6.1"
strsim = "0.11.1"
strum = { version = "0.28.0", features = ["derive"] }
syn = "2.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
unicode-segmentation = "1.13.3"

insta = "1.48.0"
tempfile = "3.27.0"
