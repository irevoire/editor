[package]
name = "editor"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
env_logger = "0.11.11"
jiff = "0.2.35"
log = "0.4.33"
oneshot = { version = "0.2.1", features = ["std"] }
ropey = "1.6.1"
tokio = { version = "1.53.1", features = ["full"] }
unicode-segmentation = "1.13.3"

[dev-dependencies]
insta = "1.48.0"
